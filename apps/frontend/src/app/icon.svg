<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Outer Rounded Rectangle with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#grad)" />
  <!-- Inner Background -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#080B11" />
  
  <!-- Terminal Prompt Icon (">_") in Cyan -->
  <!-- Prompt Chevron ">" -->
  <path d="M19 23 L29 32 L19 41" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Prompt Underscore "_" -->
  <line x1="33" y1="41" x2="45" y2="41" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" />
</svg>
